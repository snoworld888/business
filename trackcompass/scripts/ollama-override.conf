# Ollama 显存优化 override（systemd drop-in）
#
# 部署位置：/etc/systemd/system/ollama.service.d/override.conf
#
# 依据（均为本机实测，详见 docs/显存优化与云模型评估.md）：
#   · qwen3.8:27b @128K → 权重 15,339 MiB + KV 8,192 MiB ≈ 23.0 GiB
#   · 日志两次记录 "predicted to exceed available memory, evicting"
#     （predicted 42.7 GiB vs available 29.6 GiB）⇒ 128K 已贴着上限跑
#   · 实测并发驻留组合 qwen3.8:27b + qwen2.5:7b + bge-m3 ≈ 30.4 GiB / 32 GiB
#
# 三项改动与其收益：
#   1) KV_CACHE_TYPE=q8_0   → KV cache 由 f16 降为 8bit，容量减半（实测 8,192 → 4,352 MiB）
#   2) FLASH_ATTENTION=true → Ollama 要求量化 KV 必须同时开启 flash attention；
#                             另可加速长上下文推理
#   3) MAX_LOADED_MODELS=2  → 原值 3 改为 2，消除「多个对话模型并发驻留」的挤占，
#                             同时**保留 1 个嵌入模型的共存位**。
#
# 为什么是 2 而不是 1（关键）：
#   Ollama 的 MAX_LOADED_MODELS 把 **embedding 模型一并计数**。
#   RAG / 向量检索依赖 bge-m3 常驻；若设为 1，则每次「向量化 + 对话」交替
#   都会把对方驱逐出显存，导致 15.3 GiB 的对话模型权重**反复重载**
#   （首 token 从毫秒级涨到数十秒）。设 2 恰好容纳「1 对话 + 1 嵌入」的稳定组合。
#
# 预期效果：省约 6 GiB 以上，且 **128K 上下文能力完整保留**，RAG 嵌入不受影响。
#   实测共存预算：qwen3.8:27b@128K(q8_0 KV) ≈ 19.2 GiB + bge-m3 ≈ 0.6 GiB ≈ 19.8 GiB / 32 GiB
#
# 回滚：cp override.conf.bak.<时间戳> override.conf && systemctl daemon-reload && systemctl restart ollama

[Service]
Environment="OLLAMA_HOST=0.0.0.0"
Environment="OLLAMA_MAX_LOADED_MODELS=2"
Environment="OLLAMA_FLASH_ATTENTION=true"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
